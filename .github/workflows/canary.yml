name: Source drift canary

# NFR-5. Both sources are undocumented, so the failure mode that matters is a
# silent one: the endpoint keeps answering 200 while a field is renamed or
# `unitPrice` is redefined. This runs the canary against the live sources.
#
# GitHub Actions is fine for this one — unlike the scheduled ingest it needs no
# persistent disk. Caveat: the run comes from a GitHub IP, so the store
# directory and region can differ from the machine that ingests. Exit code 2
# ("could not reach a source") is downgraded to a warning rather than a failure,
# so a blocked runner does not look like drift.

on:
  workflow_dispatch:
  schedule:
    # 06:17 UTC daily — off the hour, so it does not join the cron thundering herd.
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the canary
        shell: bash
        run: |
          set +e
          python tools/canary.py
          code=$?
          set -e
          case "$code" in
            0) echo "no drift" ;;
            2) echo "::warning::canary could not reach a source; not counted as drift" ;;
            *) echo "::error::source drift detected (exit $code)"; exit "$code" ;;
          esac
